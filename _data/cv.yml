        summary: An exercise analysis method, a server, and a terminal apparatus used for exercise analysis are provided. In the method, sensing data is transmitted through the network, analysis information is generated based on the sensing data, analysis information is fed back through the network, and analysis information is presented through the user interface. The sensing data corresponds to the motion state. Analysis information is used to analyze movement status. Therefore, the operating experience could be improved.

